name: Integration tests

# Runs the tests against a real WebDAV server of Sabre, which the tests start themselves with the built-in web server
# of PHP behind a small TLS proxy (requires python3, which is part of the runner).
on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests with WebDAV server (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
    services:
      database:
        # a fixed LTS version, so a new major release does not break the tests unnoticed.
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # let the tests fail instead of skipping them, if the WebDAV server could not be started.
      EFMLWD_INTEGRATION_REQUIRED: 1
    steps:
      # this plugin and the main plugin are checked out side by side, like in wp-content/plugins/.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: external-files-from-webdav
          persist-credentials: false

      - name: Checkout main plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: threadi/external-files-in-media-library
          path: external-files-in-media-library
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql
          coverage: none

      - name: Install dependencies of the main plugin
        working-directory: external-files-in-media-library
        run: composer install --no-interaction --no-progress

      - name: Install dependencies
        working-directory: external-files-from-webdav
        run: composer install --no-interaction --no-progress

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        working-directory: external-files-from-webdav
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run integration tests
        working-directory: external-files-from-webdav
        run: composer test-integration

